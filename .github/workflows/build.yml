# ============================================================================
# dnf-for-termux: CI de PRUEBA — build con el sistema oficial termux-packages
# ============================================================================
# Compila los 3 paquetes base (zchunk, libcomps, libsolv) usando el sistema
# oficial termux-packages materializado sobre la marcha:
#   1. Clona termux-packages y copia packages/* (overlay) encima.
#   2. ./build-package.sh -a aarch64 -i <paquete>  → -i descarga las deps
#      YA COMPILADAS del repo oficial de Termux (solo compila el paquete pedido).
#   3. Verifica que los binarios/ELF del .deb generado son AArch64.
# Los .deb quedan en /home/builder/.termux-build/<paquete>/*.deb
# (build-package.sh es idempotente: no recompila si el .deb ya existe).
# ============================================================================

name: build

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint build scripts
        run: |
          for f in packages/*/build.sh; do bash -n "$f"; done

  build:
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        pkg: [zchunk, libcomps, libsolv]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Materialize termux-packages + overlay de packages/
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages.git "$GITHUB_WORKSPACE/termux-packages"
          cp -r packages/* "$GITHUB_WORKSPACE/termux-packages/packages/"

          # Fix: make the c++/v1 header tweak in termux_setup_toolchain_29.sh non-fatal.
          # Under set -e -o pipefail it can abort silently (grep no-match or sed -i
          # copy-up failure on fuse-overlayfs read-only NDK headers) breaking libcomps.
          python3 - <<'EOF'
          import os, pathlib, re
          p = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "termux-packages/scripts/build/toolchain/termux_setup_toolchain_29.sh"
          s = p.read_text()
          # Regex robusta: hace no-fatal la pipeline del c++/v1 header tweak (grep|xargs sed -i),
          # independientemente de los escapes (\") que tenga la línea real en master.
          pat = re.compile(r"(grep -lrw \$TERMUX_STANDALONE_TOOLCHAIN/sysroot/usr/include/c\+\+/v1[^\n]*)", re.M)
          if pat.search(s):
              p.write_text(pat.sub(lambda m: m.group(1) + ' || true', s))
              print("OK: toolchain c++/v1 tweak made non-fatal")
          else:
              print("WARN: c++/v1 tweak pattern not found, toolchain script may differ")
          EOF
          # Diagnóstico: confirmar la línea quedó no-fatal (debe terminar en || true)
          grep -n "c++/v1" "$GITHUB_WORKSPACE/termux-packages/scripts/build/toolchain/termux_setup_toolchain_29.sh" | head -3 || true

      - name: Build ${{ matrix.pkg }} (aarch64)
        working-directory: ${{ github.workspace }}/termux-packages
        run: |
          if [ "${{ matrix.pkg }}" = "libcomps" ]; then
            # DIAGNÓSTICO: bash -x para revelar el exit 1 silencioso tras el elf-cleaner.
            # Sin -d (dry-run): el comando completo corre en el docker real y su salida
            # se captura a /tmp/diag-libcomps.log. set +e/-e evita que el step aborte
            # antes del tail (GH Actions corre bash con -e -o pipefail).
            set +e
            ./scripts/run-docker.sh bash -x ./build-package.sh -I -C -a aarch64 libcomps > /tmp/diag-libcomps.log 2>&1
            rc=$?
            set -e
            echo "run-docker terminó (exit $rc)"
          else
            ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 "${{ matrix.pkg }}"
          fi
          echo "===== DIAGNÓSTICO: ÚLTIMAS 120 LÍNEAS (libcomps) ====="
          tail -120 /tmp/diag-libcomps.log 2>/dev/null || true

      - name: Verify AArch64 architecture
        run: |
          set -e
          DEB=$(find "$GITHUB_WORKSPACE/termux-packages" -name '*.deb' 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then echo "❌ No .deb found"; exit 1; fi
          echo "DEB: $DEB"
          mkdir -p /tmp/extract && dpkg-deb -x "$DEB" /tmp/extract
          NON_ARCH=0
          while IFS= read -r f; do
            FT=$(file "$f")
            echo "$FT"
            case "$FT" in
              *ELF*)
                if ! echo "$FT" | grep -q 'aarch64\|ARM aarch64'; then
                  echo "❌ NOT aarch64: $f"; NON_ARCH=1
                fi ;;
            esac
          done < <(find /tmp/extract -type f \( -name '*.so*' -o -perm -111 \) 2>/dev/null)
          exit $NON_ARCH

      - name: Stage .deb artifact
        run: |
          set -e
          mkdir -p /tmp/artifacts
          DEB=$(find "$GITHUB_WORKSPACE/termux-packages" -name '*.deb' 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then echo "❌ No .deb found to stage"; exit 1; fi
          cp "$DEB" /tmp/artifacts/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-aarch64
          path: /tmp/artifacts/
          if-no-files-found: error
