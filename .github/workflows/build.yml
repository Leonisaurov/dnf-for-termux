# ============================================================================
# dnf-for-termux: CI/CD Pipeline
# ============================================================================
# Compila todo el stack de DNF para Termux usando cross-compilation.
# Corre en GitHub Actions (NO localmente - evitamos OOM killer).
#
# Cadena de dependencias:
#   zchunk → libcomps → libsolv → librepo → dnf5 → RPM
#
# Infraestructura:
#   - Container: ghcr.io/termux/termux-builder:latest
#   - Target: aarch64 (ARM64)
#   - Caching: S3/artifacts entre jobs
#   - Release: GitHub Releases + GitHub Pages (repo RPM)
# ============================================================================

name: build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: "Component to build (all, zchunk, libcomps, libsolv, librepo, dnf5, rpm)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - zchunk
          - libcomps
          - libsolv
          - librepo
          - dnf5
          - rpm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PREFIX: /data/data/com.termux/files/usr
  TARGET_ARCH: aarch64
  CACHE_BUCKET: dnf-termux-cache

jobs:
  # --------------------------------------------------------------------------
  # VALIDATION: Check patches and structure
  # --------------------------------------------------------------------------
  validate:
    name: "🔍 Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Check patches apply cleanly
        run: |
          for component in dnf5 libsolv librepo rpm; do
            PATCH_DIR="patches/$component"
            SRC_DIR="source/$component"
            if [ -d "$PATCH_DIR" ]; then
              for patch in "$PATCH_DIR"/*.patch; do
                if [ -s "$patch" ]; then
                  echo "Checking: $patch"
                  if ! patch --dry-run -p1 -d "$SRC_DIR" < "$patch" 2>/dev/null; then
                    echo "❌ Patch failed: $patch"
                    patch --dry-run -p0 -d "$SRC_DIR" < "$patch" 2>/dev/null || true
                    exit 1
                  fi
                  echo "  ✅ OK"
                fi
              done
            fi
          done
          echo "✅ All patches verified"

      - name: Check submodules initialized
        run: |
          git submodule status
          if git submodule status | grep -q "^-"; then
            echo "❌ Some submodules not initialized"
            exit 1
          fi
          echo "✅ All submodules initialized"

  # --------------------------------------------------------------------------
  # BUILD COMPONENT: Reusable build step
  # --------------------------------------------------------------------------
  build-component:
    name: "📦 Build ${{ matrix.component }}"
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - zchunk
          - libcomps
          - libsolv
          - librepo
          - dnf5
          - rpm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Cache build artifacts
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            build/termux/${{ matrix.component }}/staging/
          key: termux-${{ matrix.component }}-${{ hashFiles(format('build/termux/{0}/build.sh', matrix.component), format('patches/{0}/*.patch', matrix.component)) }}
          restore-keys: |
            termux-${{ matrix.component }}-

      - name: Restore RPM cache (for librepo)
        if: matrix.component == 'librepo'
        uses: actions/cache/restore@v4
        id: rpm-cache
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-
          restore-keys: |
            termux-rpm-
          fail-on-cache-miss: false

      - name: Check RPM availability (librepo)
        if: matrix.component == 'librepo'
        run: |
          if [ -d "build/termux/rpm/staging/$TERMUX_PREFIX/include/rpm" ]; then
            echo "✅ RPM headers found in cache"
            echo "RPM_INCLUDE_DIR=$PWD/build/termux/rpm/staging/$TERMUX_PREFIX/include" >> $GITHUB_ENV
            echo "RPM_LIB_DIR=$PWD/build/termux/rpm/staging/$TERMUX_PREFIX/lib" >> $GITHUB_ENV
          else
            echo "⚠️ RPM not cached — skipping librepo (run rpm build first)"
            echo "SKIP_LIBREPO=true" >> $GITHUB_ENV
          fi

      - name: Restore RPM cache
        if: matrix.component == 'dnf5'
        uses: actions/cache/restore@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-
          restore-keys: termux-rpm-
          fail-on-cache-miss: false

      - name: Restore libsolv cache
        if: matrix.component == 'dnf5'
        uses: actions/cache/restore@v4
        with:
          path: build/termux/libsolv/staging/
          key: termux-libsolv-
          restore-keys: termux-libsolv-
          fail-on-cache-miss: false

      - name: Restore librepo cache
        if: matrix.component == 'dnf5'
        uses: actions/cache/restore@v4
        with:
          path: build/termux/librepo/staging/
          key: termux-librepo-
          restore-keys: termux-librepo-
          fail-on-cache-miss: false

      - name: Restore libcomps cache
        if: matrix.component == 'dnf5'
        uses: actions/cache/restore@v4
        with:
          path: build/termux/libcomps/staging/
          key: termux-libcomps-
          restore-keys: termux-libcomps-
          fail-on-cache-miss: false

      - name: Restore zchunk cache
        if: matrix.component == 'dnf5'
        uses: actions/cache/restore@v4
        with:
          path: build/termux/zchunk/staging/
          key: termux-zchunk-
          restore-keys: termux-zchunk-
          fail-on-cache-miss: false

      - name: Restore dependency caches (for dnf5)
        if: matrix.component == 'dnf5'
        run: |
          # RPM
          if [ -d "build/termux/rpm/staging/$TERMUX_PREFIX/include/rpm" ]; then
            echo "✅ RPM headers found"
            echo "RPM_DIR=$PWD/build/termux/rpm/staging/$TERMUX_PREFIX" >> $GITHUB_ENV
          else
            echo "⚠️ RPM not cached — may fail"
          fi
          # libsolv
          if [ -d "build/termux/libsolv/staging/$TERMUX_PREFIX/include/solv" ]; then
            echo "✅ libsolv headers found"
            echo "LIBSOLV_DIR=$PWD/build/termux/libsolv/staging/$TERMUX_PREFIX" >> $GITHUB_ENV
          fi
          # librepo
          if [ -d "build/termux/librepo/staging/$TERMUX_PREFIX/include/librepo" ]; then
            echo "✅ librepo headers found"
            echo "LIBREPO_DIR=$PWD/build/termux/librepo/staging/$TERMUX_PREFIX" >> $GITHUB_ENV
          fi
          # libcomps
          if [ -d "build/termux/libcomps/staging/$TERMUX_PREFIX/include/libcomps" ]; then
            echo "✅ libcomps headers found"
            echo "LIBCOMPS_DIR=$PWD/build/termux/libcomps/staging/$TERMUX_PREFIX" >> $GITHUB_ENV
          fi
          # zchunk
          if [ -d "build/termux/zchunk/staging/$TERMUX_PREFIX/include/zck.h" ]; then
            echo "✅ zchunk headers found"
            echo "ZCHUNK_DIR=$PWD/build/termux/zchunk/staging/$TERMUX_PREFIX" >> $GITHUB_ENV
          fi

      - name: Build ${{ matrix.component }}
        run: |
          if [ "$SKIP_LIBREPO" = "true" ]; then
            echo "⏭️ Skipping librepo build (RPM not cached)"
            exit 0
          fi
          # Apply patches
          for patch in patches/${{ matrix.component }}/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d "source/${{ matrix.component }}" < "$patch" || true
            fi
          done

          # If we have a build script, use it
          if [ -f "build/termux/${{ matrix.component }}/build.sh" ]; then
            echo "Using custom build.sh"
            chmod +x "build/termux/${{ matrix.component }}/build.sh"
            # Export dependency paths for dnf5
            if [ "${{ matrix.component }}" = "dnf5" ]; then
              export RPM_DIR="${RPM_DIR:-}" LIBSOLV_DIR="${LIBSOLV_DIR:-}" LIBREPO_DIR="${LIBREPO_DIR:-}" LIBCOMPS_DIR="${LIBCOMPS_DIR:-}" ZCHUNK_DIR="${ZCHUNK_DIR:-}"
            fi
            TERMUX_PREFIX=$TERMUX_PREFIX \
            TARGET_ARCH=$TARGET_ARCH \
            RPM_INCLUDE_DIR="$RPM_INCLUDE_DIR" \
            RPM_LIB_DIR="$RPM_LIB_DIR" \
            ./build/termux/${{ matrix.component }}/build.sh
          else
            echo "⚠️  No build.sh yet for ${{ matrix.component }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ github.sha }}
          path: build/termux/${{ matrix.component }}/staging/
          retention-days: 30
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # REPOSITORY: Generate RPM repository metadata
  # --------------------------------------------------------------------------
  create-repo:
    name: "📚 Create RPM Repository"
    needs: [build-component]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true

      - name: Create RPM repository
        run: |
          mkdir -p /tmp/repo
          if [ -d /tmp/artifacts ] && [ "$(find /tmp/artifacts -name '*.rpm' 2>/dev/null | head -1)" != "" ]; then
            find /tmp/artifacts -name "*.rpm" -exec cp {} /tmp/repo/ \;
            sudo apt-get update && sudo apt-get install -y createrepo_c
            createrepo_c /tmp/repo
            echo "Repository created with $(ls /tmp/repo/*.rpm 2>/dev/null | wc -l) packages"
          else
            echo "⚠️ No RPM artifacts found — skipping repository creation"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/repo
          destination_dir: rpm

  # --------------------------------------------------------------------------
  # RELEASE: Create GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: "🏷️ Release"
    needs: [build-component]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          fail_on_unmatched_files: false
