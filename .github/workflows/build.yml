# ============================================================================
# dnf-for-termux: CI/CD Pipeline — Arquitectura Paralela
# ============================================================================
# Cada componente tiene 2 jobs:
#   1. check-cache-{componente} — lookup-only (sin container, 0 recursos)
#   2. build-{componente} — solo si cache miss (container)
# Los builds independientes (zchunk, libcomps, libsolv, rpm) corren en paralelo.
# Librepo espera a rpm. Dnf5 espera a TODOS.
# ============================================================================

name: build

on:
  # Only manual dispatch - automatic triggers disabled to avoid cache interference
  workflow_dispatch:
    inputs:
      component:
        description: "Component to build (all, zchunk, libcomps, libsolv, librepo, dnf5, rpm)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - zchunk
          - libcomps
          - libsolv
          - librepo
          - dnf5
          - rpm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PREFIX: /data/data/com.termux/files/usr
  TARGET_ARCH: aarch64
  BUILDER_IMAGE: ghcr.io/termux/package-builder:latest

jobs:
  # ==========================================================================
  # VALIDATION: Check patches and structure
  # ==========================================================================
  validate:
    name: "🔍 Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Check patches apply cleanly
        run: |
          for component in dnf5 libsolv librepo rpm; do
            PATCH_DIR="patches/$component"
            SRC_DIR="source/$component"
            if [ -d "$PATCH_DIR" ]; then
              for patch in "$PATCH_DIR"/*.patch; do
                if [ -s "$patch" ]; then
                  echo "Checking: $patch"
                  if ! patch --dry-run -p1 -d "$SRC_DIR" < "$patch" 2>/dev/null; then
                    echo "❌ Patch failed: $patch"
                    patch --dry-run -p0 -d "$SRC_DIR" < "$patch" 2>/dev/null || true
                    exit 1
                  fi
                  echo "  ✅ OK"
                fi
              done
            fi
          done
          echo "✅ All patches verified"

      - name: Check submodules initialized
        run: |
          git submodule status
          if git submodule status | grep -q "^-"; then
            echo "❌ Some submodules not initialized"
            exit 1
          fi
          echo "✅ All submodules initialized"

  # ==========================================================================
  # RESOLVE TARGETS: Filter componentes según workflow_dispatch
  # ==========================================================================
  resolve-targets:
    name: "🎯 Resolve targets"
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      zchunk: ${{ steps.resolve.outputs.zchunk }}
      libcomps: ${{ steps.resolve.outputs.libcomps }}
      libsolv: ${{ steps.resolve.outputs.libsolv }}
      rpm: ${{ steps.resolve.outputs.rpm }}
      librepo: ${{ steps.resolve.outputs.librepo }}
      dnf5: ${{ steps.resolve.outputs.dnf5 }}
    steps:
      - id: resolve
        run: |
          REQUESTED="${{ github.event.inputs.component || 'all' }}"
          # Default all to false
          echo "zchunk=false" >> $GITHUB_OUTPUT
          echo "libcomps=false" >> $GITHUB_OUTPUT
          echo "libsolv=false" >> $GITHUB_OUTPUT
          echo "rpm=false" >> $GITHUB_OUTPUT
          echo "librepo=false" >> $GITHUB_OUTPUT
          echo "dnf5=false" >> $GITHUB_OUTPUT

          case "$REQUESTED" in
            all)
              echo "zchunk=true" >> $GITHUB_OUTPUT
              echo "libcomps=true" >> $GITHUB_OUTPUT
              echo "libsolv=true" >> $GITHUB_OUTPUT
              echo "rpm=true" >> $GITHUB_OUTPUT
              echo "librepo=true" >> $GITHUB_OUTPUT
              echo "dnf5=true" >> $GITHUB_OUTPUT
              ;;
            dnf5)
              echo "zchunk=true" >> $GITHUB_OUTPUT  # dep
              echo "libcomps=true" >> $GITHUB_OUTPUT # dep
              echo "libsolv=true" >> $GITHUB_OUTPUT  # dep
              echo "rpm=true" >> $GITHUB_OUTPUT      # dep
              echo "librepo=true" >> $GITHUB_OUTPUT  # dep
              echo "dnf5=true" >> $GITHUB_OUTPUT     # requested
              ;;
            librepo)
              echo "rpm=true" >> $GITHUB_OUTPUT      # dep
              echo "librepo=true" >> $GITHUB_OUTPUT  # requested
              ;;
            rpm)
              echo "rpm=true" >> $GITHUB_OUTPUT
              ;;
            zchunk)
              echo "zchunk=true" >> $GITHUB_OUTPUT
              ;;
            libcomps)
              echo "libcomps=true" >> $GITHUB_OUTPUT
              ;;
            libsolv)
              echo "libsolv=true" >> $GITHUB_OUTPUT
              ;;
          esac

  # ==========================================================================
  # CHECK CACHE: zchunk (independiente)
  # ==========================================================================
  check-cache-zchunk:
    name: "🔍 Check zchunk"
    needs: [resolve-targets]
    if: needs.resolve-targets.outputs.zchunk == 'true'
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.check.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - id: check
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-zchunk-${{ hashFiles('build/termux/zchunk/build.sh', 'patches/zchunk/*.patch') }}
          lookup-only: true

  # ==========================================================================
  # CHECK CACHE: libcomps (independiente)
  # ==========================================================================
  check-cache-libcomps:
    name: "🔍 Check libcomps"
    needs: [resolve-targets]
    if: needs.resolve-targets.outputs.libcomps == 'true'
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.check.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - id: check
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-libcomps-${{ hashFiles('build/termux/libcomps/build.sh', 'patches/libcomps/*.patch') }}
          lookup-only: true

  # ==========================================================================
  # CHECK CACHE: libsolv (independiente)
  # ==========================================================================
  check-cache-libsolv:
    name: "🔍 Check libsolv"
    needs: [resolve-targets]
    if: needs.resolve-targets.outputs.libsolv == 'true'
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.check.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - id: check
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-libsolv-v4-${{ hashFiles('build/termux/libsolv/build.sh', 'patches/libsolv/*.patch') }}
          lookup-only: true

  # ==========================================================================
  # CHECK CACHE: rpm (independiente)
  # ==========================================================================
  check-cache-rpm:
    name: "🔍 Check rpm"
    needs: [resolve-targets]
    if: needs.resolve-targets.outputs.rpm == 'true'
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.check.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - id: check
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-rpm-${{ hashFiles('build/termux/rpm/build.sh', 'patches/rpm/*.patch') }}
          lookup-only: true

  # ==========================================================================
  # BUILD: zchunk (independiente)
  # ==========================================================================
  build-zchunk:
    name: "📦 Build zchunk"
    needs: [check-cache-zchunk]
    if: needs.check-cache-zchunk.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # === Android NDK for cross-compilation ===
      - name: Restore NDK cache
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /tmp/android-ndk
          key: android-ndk-r27-x86_64-linux-v3

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x scripts/setup-ndk.sh
          ./scripts/setup-ndk.sh

      - name: Apply patches
        shell: bash
        run: |
          mkdir -p build/termux/zchunk/staging
          for patch in patches/zchunk/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d source/zchunk < "$patch" || true
            fi
          done

      - name: Build zchunk
        shell: bash
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
        run: |
          chmod +x build/termux/zchunk/build.sh
          ./build/termux/zchunk/build.sh

      - name: Cache zchunk
        uses: actions/cache/save@v4
        with:
          path: build/termux/zchunk/staging/
          key: termux-zchunk-${{ hashFiles('build/termux/zchunk/build.sh', 'patches/zchunk/*.patch') }}

  # ==========================================================================
  # BUILD: libcomps (independiente)
  # ==========================================================================
  build-libcomps:
    name: "📦 Build libcomps"
    needs: [check-cache-libcomps]
    if: needs.check-cache-libcomps.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # === Android NDK for cross-compilation ===
      - name: Restore NDK cache
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /tmp/android-ndk
          key: android-ndk-r27-x86_64-linux-v3

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x scripts/setup-ndk.sh
          ./scripts/setup-ndk.sh

      - name: Apply patches
        shell: bash
        run: |
          mkdir -p build/termux/libcomps/staging
          for patch in patches/libcomps/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d source/libcomps < "$patch" || true
            fi
          done

      - name: Build libcomps
        shell: bash
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
        run: |
          chmod +x build/termux/libcomps/build.sh
          ./build/termux/libcomps/build.sh

      - name: Cache libcomps
        uses: actions/cache/save@v4
        with:
          path: build/termux/libcomps/staging/
          key: termux-libcomps-${{ hashFiles('build/termux/libcomps/build.sh', 'patches/libcomps/*.patch') }}

  # ==========================================================================
  # BUILD: libsolv (restaura RPM cache para ENABLE_RPMDB)
  # ==========================================================================
  build-libsolv:
    name: "📦 Build libsolv"
    needs: [check-cache-libsolv]
    if: needs.check-cache-libsolv.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # === Android NDK for cross-compilation ===
      - name: Restore NDK cache
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /tmp/android-ndk
          key: android-ndk-r27-x86_64-linux-v3

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x scripts/setup-ndk.sh
          ./scripts/setup-ndk.sh

      - name: Apply patches
        shell: bash
        run: |
          mkdir -p build/termux/libsolv/staging
          for patch in patches/libsolv/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d source/libsolv < "$patch" || true
            fi
          done

      - name: Restore RPM cache (for ENABLE_RPMDB)
        uses: actions/cache/restore@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-${{ hashFiles('build/termux/rpm/build.sh', 'patches/rpm/*.patch') }}
          fail-on-cache-miss: false

      - name: Build libsolv
        shell: bash
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
          RPM_DIR: ${{ github.workspace }}/build/termux/rpm/staging/${{ env.TERMUX_PREFIX }}
        run: |
          chmod +x build/termux/libsolv/build.sh
          ./build/termux/libsolv/build.sh

      - name: Cache libsolv
        uses: actions/cache/save@v4
        with:
          path: build/termux/libsolv/staging/
          key: termux-libsolv-v4-${{ hashFiles('build/termux/libsolv/build.sh', 'patches/libsolv/*.patch') }}

  # ==========================================================================
  # BUILD: rpm (independiente)
  # ==========================================================================
  build-rpm:
    name: "📦 Build rpm"
    needs: [check-cache-rpm]
    if: needs.check-cache-rpm.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # === Android NDK for cross-compilation ===
      - name: Restore NDK cache
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /tmp/android-ndk
          key: android-ndk-r27-x86_64-linux-v3

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x scripts/setup-ndk.sh
          ./scripts/setup-ndk.sh

      - name: Apply patches
        shell: bash
        run: |
          mkdir -p build/termux/rpm/staging
          for patch in patches/rpm/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d source/rpm < "$patch" || true
            fi
          done

      - name: Build rpm
        shell: bash
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
        run: |
          chmod +x build/termux/rpm/build.sh
          ./build/termux/rpm/build.sh

      - name: Cache rpm
        uses: actions/cache/save@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-${{ hashFiles('build/termux/rpm/build.sh', 'patches/rpm/*.patch') }}

  # ==========================================================================
  # CHECK CACHE: librepo (depende de rpm — espera a que rpm termine)
  # ==========================================================================
  check-cache-librepo:
    name: "🔍 Check librepo"
    needs: [resolve-targets, build-rpm]
    if: needs.resolve-targets.outputs.librepo == 'true'
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.check.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - id: check
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-librepo-${{ hashFiles('build/termux/librepo/build.sh', 'patches/librepo/*.patch') }}
          lookup-only: true

  # ==========================================================================
  # CHECK CACHE: dnf5 (depende de TODOS — espera a que todos terminen)
  # ==========================================================================
  check-cache-dnf5:
    name: "🔍 Check dnf5"
    needs: [resolve-targets]
    if: needs.resolve-targets.outputs.dnf5 == 'true'
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.check.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - id: check
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-dnf5-v5-${{ hashFiles('build/termux/dnf5/build.sh', 'patches/dnf5/*.patch') }}
          lookup-only: true

  # ==========================================================================
  # BUILD: librepo (necesita rpm staging)
  # ==========================================================================
  build-librepo:
    name: "📦 Build librepo"
    needs: [check-cache-librepo]
    if: needs.check-cache-librepo.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # === Android NDK for cross-compilation ===
      - name: Restore NDK cache
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /tmp/android-ndk
          key: android-ndk-r27-x86_64-linux-v3

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x scripts/setup-ndk.sh
          ./scripts/setup-ndk.sh

      - name: Restore rpm staging
        uses: actions/cache/restore@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-${{ hashFiles('build/termux/rpm/build.sh', 'patches/rpm/*.patch') }}
          fail-on-cache-miss: false

      - name: Apply patches
        shell: bash
        run: |
          mkdir -p build/termux/librepo/staging
          for patch in patches/librepo/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d source/librepo < "$patch" || true
            fi
          done

      - name: Build librepo
        shell: bash
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
          RPM_DIR: ${{ github.workspace }}/build/termux/rpm/staging/${{ env.TERMUX_PREFIX }}
        run: |
          if [ ! -d "$RPM_DIR/include/rpm" ]; then
            echo "⚠️  RPM headers not found in staging — librepo build may fail"
            echo "   Expected at: $RPM_DIR"
          else
            echo "✅ RPM headers found at $RPM_DIR"
          fi
          chmod +x build/termux/librepo/build.sh
          ./build/termux/librepo/build.sh

      - name: Cache librepo
        uses: actions/cache/save@v4
        with:
          path: build/termux/librepo/staging/
          key: termux-librepo-${{ hashFiles('build/termux/librepo/build.sh', 'patches/librepo/*.patch') }}

  # ==========================================================================
  # BUILD: dnf5 (necesita TODOS los staging)
  # ==========================================================================
  build-dnf5:
    name: "📦 Build dnf5"
    needs: [check-cache-dnf5, build-libsolv]
    if: ${{ always() && needs.check-cache-dnf5.outputs.cache-hit != 'true' && needs.build-libsolv.result != 'failure' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # === Android NDK for cross-compilation ===
      - name: Restore NDK cache
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /tmp/android-ndk
          key: android-ndk-r27-x86_64-linux-v3

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x scripts/setup-ndk.sh
          ./scripts/setup-ndk.sh

      # Restaurar TODAS las dependencias desde cache
      - name: Restore zchunk staging
        uses: actions/cache/restore@v4
        with:
          path: build/termux/zchunk/staging/
          key: termux-zchunk-${{ hashFiles('build/termux/zchunk/build.sh', 'patches/zchunk/*.patch') }}
          fail-on-cache-miss: false
      - name: Restore libcomps staging
        uses: actions/cache/restore@v4
        with:
          path: build/termux/libcomps/staging/
          key: termux-libcomps-${{ hashFiles('build/termux/libcomps/build.sh', 'patches/libcomps/*.patch') }}
          fail-on-cache-miss: false
      - name: Restore libsolv staging
        uses: actions/cache/restore@v4
        with:
          path: build/termux/libsolv/staging/
          key: termux-libsolv-v4-${{ hashFiles('build/termux/libsolv/build.sh', 'patches/libsolv/*.patch') }}
          fail-on-cache-miss: false
      - name: Restore rpm staging
        uses: actions/cache/restore@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-${{ hashFiles('build/termux/rpm/build.sh', 'patches/rpm/*.patch') }}
          fail-on-cache-miss: false
      - name: Restore librepo staging
        uses: actions/cache/restore@v4
        with:
          path: build/termux/librepo/staging/
          key: termux-librepo-${{ hashFiles('build/termux/librepo/build.sh', 'patches/librepo/*.patch') }}
          fail-on-cache-miss: false

      - name: Apply patches
        shell: bash
        run: |
          mkdir -p build/termux/dnf5/staging
          for patch in patches/dnf5/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d source/dnf5 < "$patch" || true
            fi
          done

      - name: Build dnf5
        shell: bash
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
          RPM_DIR: ${{ github.workspace }}/build/termux/rpm/staging/${{ env.TERMUX_PREFIX }}
          LIBSOLV_DIR: ${{ github.workspace }}/build/termux/libsolv/staging/${{ env.TERMUX_PREFIX }}
          LIBREPO_DIR: ${{ github.workspace }}/build/termux/librepo/staging/${{ env.TERMUX_PREFIX }}
          LIBCOMPS_DIR: ${{ github.workspace }}/build/termux/libcomps/staging/${{ env.TERMUX_PREFIX }}
          ZCHUNK_DIR: ${{ github.workspace }}/build/termux/zchunk/staging/${{ env.TERMUX_PREFIX }}
        run: |
          # Verificar dependencias disponibles
          ALL_DEPS="rpm libsolv librepo libcomps zchunk"
          MISSING=""
          for dep in $ALL_DEPS; do
            DEP_VAR="${dep^^}_DIR"
            if [ -d "${!DEP_VAR}" ]; then
              echo "✅ $dep disponible: ${!DEP_VAR}"
            else
              echo "⚠️  $dep NO disponible"
              MISSING="$MISSING $dep"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️  Dependencias faltantes:$MISSING"
            echo "   El build puede fallar si estas dependencias son requeridas."
          fi
          chmod +x build/termux/dnf5/build.sh
          ./build/termux/dnf5/build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dnf5-${{ github.sha }}
          path: |
            build/termux/dnf5/staging/
            build/termux/rpm/staging/
          retention-days: 30
          if-no-files-found: ignore

      - name: Cache dnf5
        uses: actions/cache/save@v4
        with:
          path: build/termux/dnf5/staging/
          key: termux-dnf5-v5-${{ hashFiles('build/termux/dnf5/build.sh', 'patches/dnf5/*.patch') }}

  # ==========================================================================
  # CREATE REPO: Generar metadatos del repositorio RPM (solo main)
  # ==========================================================================
  create-repo:
    name: "📚 Create RPM Repository"
    needs: [build-dnf5]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dnf5-*
          path: /tmp/artifacts
          merge-multiple: true
      - name: Create RPM repository
        run: |
          mkdir -p /tmp/repo
          if [ -d /tmp/artifacts ] && [ "$(find /tmp/artifacts -name '*.rpm' 2>/dev/null | head -1)" != "" ]; then
            find /tmp/artifacts -name "*.rpm" -exec cp {} /tmp/repo/ \;
            sudo apt-get update && sudo apt-get install -y createrepo_c
            createrepo_c /tmp/repo
            echo "Repository created with $(ls /tmp/repo/*.rpm 2>/dev/null | wc -l) packages"
          else
            echo "⚠️ No RPM artifacts found — skipping repository creation"
          fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/repo
          destination_dir: rpm

  # ==========================================================================
  # RELEASE: Crear GitHub Release (solo tags v*)
  # ==========================================================================
  release:
    name: "🏷️ Release"
    needs: [build-dnf5]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dnf5-*
          path: /tmp/release-artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          fail_on_unmatched_files: false
