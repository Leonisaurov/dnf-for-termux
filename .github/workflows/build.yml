# ============================================================================
# dnf-for-termux: CI/CD Pipeline
# ============================================================================
# Compila todo el stack de DNF para Termux usando cross-compilation.
# Con pre-check de caches para evitar containers innecesarios.
# ============================================================================

name: build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: "Component to build (all, zchunk, libcomps, libsolv, librepo, dnf5, rpm)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - zchunk
          - libcomps
          - libsolv
          - librepo
          - dnf5
          - rpm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PREFIX: /data/data/com.termux/files/usr
  TARGET_ARCH: aarch64

jobs:
  # --------------------------------------------------------------------------
  # VALIDATION: Check patches and structure
  # --------------------------------------------------------------------------
  validate:
    name: "🔍 Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Check patches apply cleanly
        run: |
          for component in dnf5 libsolv librepo rpm; do
            PATCH_DIR="patches/$component"
            SRC_DIR="source/$component"
            if [ -d "$PATCH_DIR" ]; then
              for patch in "$PATCH_DIR"/*.patch; do
                if [ -s "$patch" ]; then
                  echo "Checking: $patch"
                  if ! patch --dry-run -p1 -d "$SRC_DIR" < "$patch" 2>/dev/null; then
                    echo "❌ Patch failed: $patch"
                    patch --dry-run -p0 -d "$SRC_DIR" < "$patch" 2>/dev/null || true
                    exit 1
                  fi
                  echo "  ✅ OK"
                fi
              done
            fi
          done
          echo "✅ All patches verified"

      - name: Check submodules initialized
        run: |
          git submodule status
          if git submodule status | grep -q "^-"; then
            echo "❌ Some submodules not initialized"
            exit 1
          fi
          echo "✅ All submodules initialized"

  # --------------------------------------------------------------------------
  # CHECK CACHES: Pre-check which components need building (fast, no container)
  # Usa actions/cache con lookup-only para verificar existencia exacta de cache
  # sin descargar ni arrancar container.
  # --------------------------------------------------------------------------
  check-caches:
    name: "🔍 Check caches"
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.set-output.outputs.needs-build }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # Check each component cache with lookup-only (no download, no container)
      - name: Check zchunk cache
        id: cache-zchunk
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-zchunk-${{ hashFiles('build/termux/zchunk/build.sh', 'patches/zchunk/*.patch') }}
          lookup-only: true

      - name: Check libcomps cache
        id: cache-libcomps
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-libcomps-${{ hashFiles('build/termux/libcomps/build.sh', 'patches/libcomps/*.patch') }}
          lookup-only: true

      - name: Check libsolv cache
        id: cache-libsolv
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-libsolv-${{ hashFiles('build/termux/libsolv/build.sh', 'patches/libsolv/*.patch') }}
          lookup-only: true

      - name: Check rpm cache
        id: cache-rpm
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-rpm-${{ hashFiles('build/termux/rpm/build.sh', 'patches/rpm/*.patch') }}
          lookup-only: true

      - name: Check librepo cache
        id: cache-librepo
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-librepo-${{ hashFiles('build/termux/librepo/build.sh', 'patches/librepo/*.patch') }}
          lookup-only: true

      - name: Check dnf5 cache
        id: cache-dnf5
        uses: actions/cache@v4
        with:
          path: /dev/null
          key: termux-dnf5-${{ hashFiles('build/termux/dnf5/build.sh', 'patches/dnf5/*.patch') }}
          lookup-only: true

      - name: Determine what needs building
        id: set-output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Read requested component from workflow_dispatch (default: "all")
          REQUESTED="${{ github.event.inputs.component || 'all' }}"
          
          declare -A CACHE_HITS
          CACHE_HITS[zchunk]="${{ steps.cache-zchunk.outputs.cache-hit }}"
          CACHE_HITS[libcomps]="${{ steps.cache-libcomps.outputs.cache-hit }}"
          CACHE_HITS[libsolv]="${{ steps.cache-libsolv.outputs.cache-hit }}"
          CACHE_HITS[rpm]="${{ steps.cache-rpm.outputs.cache-hit }}"
          CACHE_HITS[librepo]="${{ steps.cache-librepo.outputs.cache-hit }}"
          CACHE_HITS[dnf5]="${{ steps.cache-dnf5.outputs.cache-hit }}"
          
          NEEDS_BUILD=()
          ALL_CACHED=true
          
          for comp in zchunk libcomps libsolv rpm librepo dnf5; do
            # Skip if a specific component was requested and this is not it
            if [ "$REQUESTED" != "all" ] && [ "$REQUESTED" != "$comp" ]; then
              echo "⏭️  $comp: not requested, skipping"
              continue
            fi
            
            if [ "${CACHE_HITS[$comp]}" = "true" ]; then
              echo "  ✅ $comp: CACHED"
            else
              echo "  ❌ $comp: MISS → needs build"
              NEEDS_BUILD+=("$comp")
              ALL_CACHED=false
            fi
          done
          
          # Convert to JSON array for output (compact single-line para GITHUB_OUTPUT)
          echo "needs-build=$(printf '%s\n' "${NEEDS_BUILD[@]}" | jq -R . | jq -s -c .)" >> $GITHUB_OUTPUT
          
          if [ "$ALL_CACHED" = "true" ]; then
            echo "🎉 All components cached! No build needed."
          else
            echo "📦 Components to build: ${NEEDS_BUILD[*]}"
          fi

  # --------------------------------------------------------------------------
  # BUILD ALL: Sequential builds in dependency order (1 container)
  #   Order: zchunk → libcomps → libsolv → rpm → librepo → dnf5
  #   Solo ejecuta si check-caches detectó al menos un miss.
  # --------------------------------------------------------------------------
  build-all:
    name: "📦 Build components"
    needs: [check-caches]
    if: needs.check-caches.outputs.needs-build != '[]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup staging directories
        run: |
          for comp in zchunk libcomps libsolv rpm librepo dnf5; do
            mkdir -p "build/termux/$comp/staging"
          done

      # =========================================================================
      # BUILD: zchunk (independiente)
      # =========================================================================
      - name: Cache zchunk
        id: zchunk
        uses: actions/cache@v4
        with:
          path: build/termux/zchunk/staging/
          key: termux-zchunk-${{ hashFiles('build/termux/zchunk/build.sh', 'patches/zchunk/*.patch') }}

      - name: Build zchunk
        if: steps.zchunk.outputs.cache-hit != 'true'
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
        run: |
          for patch in patches/zchunk/*.patch; do
            [ -s "$patch" ] && echo "Applying: $patch" && patch -p1 -d source/zchunk < "$patch" || true
          done
          chmod +x build/termux/zchunk/build.sh
          ./build/termux/zchunk/build.sh

      # =========================================================================
      # BUILD: libcomps (independiente)
      # =========================================================================
      - name: Cache libcomps
        id: libcomps
        uses: actions/cache@v4
        with:
          path: build/termux/libcomps/staging/
          key: termux-libcomps-${{ hashFiles('build/termux/libcomps/build.sh', 'patches/libcomps/*.patch') }}

      - name: Build libcomps
        if: steps.libcomps.outputs.cache-hit != 'true'
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
        run: |
          for patch in patches/libcomps/*.patch; do
            [ -s "$patch" ] && echo "Applying: $patch" && patch -p1 -d source/libcomps < "$patch" || true
          done
          chmod +x build/termux/libcomps/build.sh
          ./build/termux/libcomps/build.sh

      # =========================================================================
      # BUILD: libsolv (independiente)
      # =========================================================================
      - name: Cache libsolv
        id: libsolv
        uses: actions/cache@v4
        with:
          path: build/termux/libsolv/staging/
          key: termux-libsolv-${{ hashFiles('build/termux/libsolv/build.sh', 'patches/libsolv/*.patch') }}

      - name: Build libsolv
        if: steps.libsolv.outputs.cache-hit != 'true'
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
        run: |
          for patch in patches/libsolv/*.patch; do
            [ -s "$patch" ] && echo "Applying: $patch" && patch -p1 -d source/libsolv < "$patch" || true
          done
          chmod +x build/termux/libsolv/build.sh
          ./build/termux/libsolv/build.sh

      # =========================================================================
      # BUILD: rpm (independiente)
      # =========================================================================
      - name: Cache rpm
        id: rpm
        uses: actions/cache@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-${{ hashFiles('build/termux/rpm/build.sh', 'patches/rpm/*.patch') }}

      - name: Build rpm
        if: steps.rpm.outputs.cache-hit != 'true'
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
        run: |
          for patch in patches/rpm/*.patch; do
            [ -s "$patch" ] && echo "Applying: $patch" && patch -p1 -d source/rpm < "$patch" || true
          done
          chmod +x build/termux/rpm/build.sh
          ./build/termux/rpm/build.sh

      # =========================================================================
      # BUILD: librepo (needs rpm headers from cache/staging)
      # =========================================================================
      - name: Cache librepo
        id: librepo
        uses: actions/cache@v4
        with:
          path: build/termux/librepo/staging/
          key: termux-librepo-${{ hashFiles('build/termux/librepo/build.sh', 'patches/librepo/*.patch') }}

      - name: Build librepo
        if: steps.librepo.outputs.cache-hit != 'true'
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
          RPM_DIR: ${{ github.workspace }}/build/termux/rpm/staging/${{ env.TERMUX_PREFIX }}
        run: |
          if [ ! -d "$RPM_DIR/include/rpm" ]; then
            echo "⚠️  RPM headers not found in staging — librepo build may fail"
            echo "   Expected at: $RPM_DIR/include/rpm"
          else
            echo "✅ RPM headers found at $RPM_DIR"
          fi
          for patch in patches/librepo/*.patch; do
            [ -s "$patch" ] && echo "Applying: $patch" && patch -p1 -d source/librepo < "$patch" || true
          done
          chmod +x build/termux/librepo/build.sh
          ./build/termux/librepo/build.sh

      # =========================================================================
      # BUILD: dnf5 (needs all deps)
      # =========================================================================
      - name: Cache dnf5
        id: dnf5
        uses: actions/cache@v4
        with:
          path: build/termux/dnf5/staging/
          key: termux-dnf5-${{ hashFiles('build/termux/dnf5/build.sh', 'patches/dnf5/*.patch') }}

      - name: Build dnf5
        if: steps.dnf5.outputs.cache-hit != 'true'
        env:
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
          RPM_DIR: ${{ github.workspace }}/build/termux/rpm/staging/${{ env.TERMUX_PREFIX }}
          LIBSOLV_DIR: ${{ github.workspace }}/build/termux/libsolv/staging/${{ env.TERMUX_PREFIX }}
          LIBREPO_DIR: ${{ github.workspace }}/build/termux/librepo/staging/${{ env.TERMUX_PREFIX }}
          LIBCOMPS_DIR: ${{ github.workspace }}/build/termux/libcomps/staging/${{ env.TERMUX_PREFIX }}
          ZCHUNK_DIR: ${{ github.workspace }}/build/termux/zchunk/staging/${{ env.TERMUX_PREFIX }}
        run: |
          # Verificar dependencias disponibles
          ALL_DEPS="rpm libsolv librepo libcomps zchunk"
          MISSING=""
          for dep in $ALL_DEPS; do
            DEP_VAR="${dep^^}_DIR"
            if [ -d "${!DEP_VAR}" ]; then
              echo "✅ $dep disponible: ${!DEP_VAR}"
            else
              echo "⚠️  $dep NO disponible"
              MISSING="$MISSING $dep"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️  Dependencias faltantes:$MISSING"
            echo "   El build puede fallar si estas dependencias son requeridas."
          fi
          
          for patch in patches/dnf5/*.patch; do
            [ -s "$patch" ] && echo "Applying: $patch" && patch -p1 -d source/dnf5 < "$patch" || true
          done
          chmod +x build/termux/dnf5/build.sh
          ./build/termux/dnf5/build.sh

      # =========================================================================
      # UPLOAD: Subir artefactos para create-repo / release
      # =========================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dnf5-${{ github.sha }}
          path: |
            build/termux/dnf5/staging/
            build/termux/rpm/staging/
          retention-days: 30
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # REPOSITORY: Generate RPM repository metadata
  # --------------------------------------------------------------------------
  create-repo:
    name: "📚 Create RPM Repository"
    needs: [build-all]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true
      - name: Create RPM repository
        run: |
          mkdir -p /tmp/repo
          if [ -d /tmp/artifacts ] && [ "$(find /tmp/artifacts -name '*.rpm' 2>/dev/null | head -1)" != "" ]; then
            find /tmp/artifacts -name "*.rpm" -exec cp {} /tmp/repo/ \;
            sudo apt-get update && sudo apt-get install -y createrepo_c
            createrepo_c /tmp/repo
            echo "Repository created with $(ls /tmp/repo/*.rpm 2>/dev/null | wc -l) packages"
          else
            echo "⚠️ No RPM artifacts found — skipping repository creation"
          fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/repo
          destination_dir: rpm

  # --------------------------------------------------------------------------
  # RELEASE: Create GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: "🏷️ Release"
    needs: [build-all]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          fail_on_unmatched_files: false
