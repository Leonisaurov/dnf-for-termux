# ============================================================================
# dnf-for-termux: CI/CD Pipeline
# ============================================================================
# Compila todo el stack de DNF para Termux usando cross-compilation nativa
# en container. Las dependencias entre componentes se resuelven via
# actions/cache (NO artifacts).
#
# Cadena de dependencias:
#   Tier 1 (paralelo): zchunk, libcomps, libsolv, rpm
#   Tier 2:            librepo (needs rpm)
#   Tier 3:            dnf5  (needs rpm, libsolv, librepo, libcomps, zchunk)
#   Delivery:          create-repo, release
#
# Infraestructura:
#   - Container: ghcr.io/termux/package-builder:latest
#   - Target: aarch64 (ARM64)
#   - Caching: actions/cache entre jobs
#   - Release: GitHub Releases + GitHub Pages (repo RPM)
# ============================================================================

name: build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: "Component to build (all, zchunk, libcomps, libsolv, librepo, dnf5, rpm)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - zchunk
          - libcomps
          - libsolv
          - librepo
          - dnf5
          - rpm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PREFIX: /data/data/com.termux/files/usr
  TARGET_ARCH: aarch64

jobs:
  # ==========================================================================
  # VALIDATE: Check patches and structure
  # ==========================================================================
  validate:
    name: "🔍 Validate"
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.component == 'all' ||
      contains(fromJson('["zchunk","libcomps","libsolv","rpm","librepo","dnf5"]'), github.event.inputs.component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Check patches apply cleanly
        run: |
          for component in dnf5 libsolv librepo rpm; do
            PATCH_DIR="patches/$component"
            SRC_DIR="source/$component"
            if [ -d "$PATCH_DIR" ]; then
              for patch in "$PATCH_DIR"/*.patch; do
                if [ -s "$patch" ]; then
                  echo "Checking: $patch"
                  if ! patch --dry-run -p1 -d "$SRC_DIR" < "$patch" 2>/dev/null; then
                    echo "❌ Patch failed: $patch"
                    patch --dry-run -p0 -d "$SRC_DIR" < "$patch" 2>/dev/null || true
                    exit 1
                  fi
                  echo "  ✅ OK"
                fi
              done
            fi
          done
          echo "✅ All patches verified"

      - name: Check submodules initialized
        run: |
          git submodule status
          if git submodule status | grep -q "^-"; then
            echo "❌ Some submodules not initialized"
            exit 1
          fi
          echo "✅ All submodules initialized"

  # ==========================================================================
  # TIER 1: Componentes independientes (paralelo, sin dependencias entre sí)
  #   - build-zchunk
  #   - build-libcomps
  #   - build-libsolv
  #   - build-rpm
  # ==========================================================================

  # --------------------------------------------------------------------------
  # BUILD ZCHUNK
  # --------------------------------------------------------------------------
  build-zchunk:
    name: "📦 Build zchunk"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.component == 'all' || github.event.inputs.component == 'zchunk'
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/termux/zchunk/staging/
          key: termux-zchunk-${{ hashFiles('build/termux/zchunk/build.sh', 'patches/zchunk/*.patch') }}
          restore-keys: |
            termux-zchunk-

      - name: Apply patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for patch in patches/zchunk/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d "source/zchunk" < "$patch" || true
            fi
          done

      - name: Build zchunk
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x build/termux/zchunk/build.sh
          TERMUX_PREFIX=$TERMUX_PREFIX \
          TARGET_ARCH=$TARGET_ARCH \
          ./build/termux/zchunk/build.sh

      - name: Show cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "✅ Cache hit — skipping zchunk build"

  # --------------------------------------------------------------------------
  # BUILD LIBCOMPS
  # --------------------------------------------------------------------------
  build-libcomps:
    name: "📦 Build libcomps"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.component == 'all' || github.event.inputs.component == 'libcomps'
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/termux/libcomps/staging/
          key: termux-libcomps-${{ hashFiles('build/termux/libcomps/build.sh', 'patches/libcomps/*.patch') }}
          restore-keys: |
            termux-libcomps-

      - name: Apply patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for patch in patches/libcomps/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d "source/libcomps" < "$patch" || true
            fi
          done

      - name: Build libcomps
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x build/termux/libcomps/build.sh
          TERMUX_PREFIX=$TERMUX_PREFIX \
          TARGET_ARCH=$TARGET_ARCH \
          ./build/termux/libcomps/build.sh

      - name: Show cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "✅ Cache hit — skipping libcomps build"

  # --------------------------------------------------------------------------
  # BUILD LIBSOLV
  # --------------------------------------------------------------------------
  build-libsolv:
    name: "📦 Build libsolv"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.component == 'all' || github.event.inputs.component == 'libsolv'
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/termux/libsolv/staging/
          key: termux-libsolv-${{ hashFiles('build/termux/libsolv/build.sh', 'patches/libsolv/*.patch') }}
          restore-keys: |
            termux-libsolv-

      - name: Apply patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for patch in patches/libsolv/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d "source/libsolv" < "$patch" || true
            fi
          done

      - name: Build libsolv
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x build/termux/libsolv/build.sh
          TERMUX_PREFIX=$TERMUX_PREFIX \
          TARGET_ARCH=$TARGET_ARCH \
          ./build/termux/libsolv/build.sh

      - name: Show cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "✅ Cache hit — skipping libsolv build"

  # --------------------------------------------------------------------------
  # BUILD RPM
  # --------------------------------------------------------------------------
  build-rpm:
    name: "📦 Build rpm"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.component == 'all' || github.event.inputs.component == 'rpm'
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-${{ hashFiles('build/termux/rpm/build.sh', 'patches/rpm/*.patch') }}
          restore-keys: |
            termux-rpm-

      - name: Apply patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for patch in patches/rpm/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d "source/rpm" < "$patch" || true
            fi
          done

      - name: Build rpm
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x build/termux/rpm/build.sh
          TERMUX_PREFIX=$TERMUX_PREFIX \
          TARGET_ARCH=$TARGET_ARCH \
          ./build/termux/rpm/build.sh

      - name: Show cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "✅ Cache hit — skipping rpm build"

  # ==========================================================================
  # TIER 2: Depende de RPM (via cache)
  #   - build-librepo
  # ==========================================================================

  # --------------------------------------------------------------------------
  # BUILD LIBREPO
  # --------------------------------------------------------------------------
  build-librepo:
    name: "📦 Build librepo"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.component == 'all' || github.event.inputs.component == 'librepo'
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # === Restaurar dependencias ===
      - name: Restore RPM cache
        uses: actions/cache/restore@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-
          restore-keys: |
            termux-rpm-
          fail-on-cache-miss: false

      - name: Check RPM availability
        run: |
          if [ -d "build/termux/rpm/staging/$TERMUX_PREFIX/include/rpm" ]; then
            echo "✅ RPM headers found in cache"
            echo "RPM_INCLUDE_DIR=$PWD/build/termux/rpm/staging/$TERMUX_PREFIX/include" >> $GITHUB_ENV
            echo "RPM_LIB_DIR=$PWD/build/termux/rpm/staging/$TERMUX_PREFIX/lib" >> $GITHUB_ENV
          else
            echo "⚠️  RPM not cached — librepo build may fail"
          fi

      # === Propio cache ===
      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/termux/librepo/staging/
          key: termux-librepo-${{ hashFiles('build/termux/librepo/build.sh', 'patches/librepo/*.patch') }}
          restore-keys: |
            termux-librepo-

      - name: Apply patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for patch in patches/librepo/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d "source/librepo" < "$patch" || true
            fi
          done

      - name: Build librepo
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x build/termux/librepo/build.sh
          TERMUX_PREFIX=$TERMUX_PREFIX \
          TARGET_ARCH=$TARGET_ARCH \
          RPM_INCLUDE_DIR="$RPM_INCLUDE_DIR" \
          RPM_LIB_DIR="$RPM_LIB_DIR" \
          ./build/termux/librepo/build.sh

      - name: Show cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "✅ Cache hit — skipping librepo build"

  # ==========================================================================
  # TIER 3: Depende de todos los anteriores (via cache)
  #   - build-dnf5
  # ==========================================================================

  # --------------------------------------------------------------------------
  # BUILD DNF5
  # --------------------------------------------------------------------------
  build-dnf5:
    name: "📦 Build dnf5"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.component == 'all' || github.event.inputs.component == 'dnf5'
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # === Restaurar dependencias ===
      - name: Restore RPM cache
        uses: actions/cache/restore@v4
        with:
          path: build/termux/rpm/staging/
          key: termux-rpm-
          restore-keys: |
            termux-rpm-
          fail-on-cache-miss: false

      - name: Restore libsolv cache
        uses: actions/cache/restore@v4
        with:
          path: build/termux/libsolv/staging/
          key: termux-libsolv-
          restore-keys: |
            termux-libsolv-
          fail-on-cache-miss: false

      - name: Restore librepo cache
        uses: actions/cache/restore@v4
        with:
          path: build/termux/librepo/staging/
          key: termux-librepo-
          restore-keys: |
            termux-librepo-
          fail-on-cache-miss: false

      - name: Restore libcomps cache
        uses: actions/cache/restore@v4
        with:
          path: build/termux/libcomps/staging/
          key: termux-libcomps-
          restore-keys: |
            termux-libcomps-
          fail-on-cache-miss: false

      - name: Restore zchunk cache
        uses: actions/cache/restore@v4
        with:
          path: build/termux/zchunk/staging/
          key: termux-zchunk-
          restore-keys: |
            termux-zchunk-
          fail-on-cache-miss: false

      - name: Check dependencies availability
        run: |
          ALL_DEPS="rpm libsolv librepo libcomps zchunk"
          MISSING=""
          for dep in $ALL_DEPS; do
            if [ -d "build/termux/$dep/staging/$TERMUX_PREFIX" ]; then
              echo "✅ $dep disponible"
            else
              echo "⚠️  $dep NO disponible"
              MISSING="$MISSING $dep"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️  Dependencias faltantes:$MISSING"
            echo "   El build puede fallar si estas dependencias son requeridas."
          fi

      # === Propio cache ===
      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/termux/dnf5/staging/
          key: termux-dnf5-${{ hashFiles('build/termux/dnf5/build.sh', 'patches/dnf5/*.patch') }}
          restore-keys: |
            termux-dnf5-

      - name: Apply patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for patch in patches/dnf5/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying: $patch"
              patch -p1 -d "source/dnf5" < "$patch" || true
            fi
          done

      - name: Build dnf5
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Exportar paths de dependencias para el build script
          export RPM_DIR="$PWD/build/termux/rpm/staging/$TERMUX_PREFIX"
          export LIBSOLV_DIR="$PWD/build/termux/libsolv/staging/$TERMUX_PREFIX"
          export LIBREPO_DIR="$PWD/build/termux/librepo/staging/$TERMUX_PREFIX"
          export LIBCOMPS_DIR="$PWD/build/termux/libcomps/staging/$TERMUX_PREFIX"
          export ZCHUNK_DIR="$PWD/build/termux/zchunk/staging/$TERMUX_PREFIX"

          echo "RPM_DIR=$RPM_DIR"
          echo "LIBSOLV_DIR=$LIBSOLV_DIR"
          echo "LIBREPO_DIR=$LIBREPO_DIR"
          echo "LIBCOMPS_DIR=$LIBCOMPS_DIR"
          echo "ZCHUNK_DIR=$ZCHUNK_DIR"

          chmod +x build/termux/dnf5/build.sh
          TERMUX_PREFIX=$TERMUX_PREFIX \
          TARGET_ARCH=$TARGET_ARCH \
          RPM_DIR="$RPM_DIR" \
          LIBSOLV_DIR="$LIBSOLV_DIR" \
          LIBREPO_DIR="$LIBREPO_DIR" \
          LIBCOMPS_DIR="$LIBCOMPS_DIR" \
          ZCHUNK_DIR="$ZCHUNK_DIR" \
          ./build/termux/dnf5/build.sh

      - name: Show cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "✅ Cache hit — skipping dnf5 build"

      # === Subir artifact para entrega (create-repo, release) ===
      - name: Upload dnf5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnf5-${{ github.sha }}
          path: build/termux/dnf5/staging/
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================================================
  # DELIVERY: Repositorio RPM y Release
  # ==========================================================================

  # --------------------------------------------------------------------------
  # CREATE REPO: Generar metadatos de repositorio RPM
  # --------------------------------------------------------------------------
  create-repo:
    name: "📚 Create RPM Repository"
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.component == 'all' || github.event.inputs.component == 'dnf5')
    needs: [build-dnf5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dnf5 artifact
        uses: actions/download-artifact@v4
        with:
          name: dnf5-${{ github.sha }}
          path: /tmp/dnf5

      - name: Create RPM repository
        run: |
          mkdir -p /tmp/repo
          if [ -d /tmp/dnf5 ] && [ "$(find /tmp/dnf5 -name '*.rpm' 2>/dev/null | head -1)" != "" ]; then
            find /tmp/dnf5 -name "*.rpm" -exec cp {} /tmp/repo/ \;
            sudo apt-get update && sudo apt-get install -y createrepo_c
            createrepo_c /tmp/repo
            echo "Repository created with $(ls /tmp/repo/*.rpm 2>/dev/null | wc -l) packages"
          else
            echo "⚠️  No RPM artifacts found — skipping repository creation"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/repo
          destination_dir: rpm

  # --------------------------------------------------------------------------
  # RELEASE: Crear GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: "🏷️ Release"
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.component == 'all' || github.event.inputs.component == 'dnf5')
    needs: [build-dnf5]
    runs-on: ubuntu-latest
    steps:
      - name: Download dnf5 artifact
        uses: actions/download-artifact@v4
        with:
          name: dnf5-${{ github.sha }}
          path: /tmp/release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          fail_on_unmatched_files: false
