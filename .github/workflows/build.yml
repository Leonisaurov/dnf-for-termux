# ============================================================================
# dnf-for-termux: CI de PRUEBA — build con el sistema oficial termux-packages
# ============================================================================
# Compila los 3 paquetes base (zchunk, libcomps, libsolv) usando el sistema
# oficial termux-packages materializado sobre la marcha:
#   1. Clona termux-packages y copia packages/* (overlay) encima.
#   2. ./build-package.sh -a aarch64 -i <paquete>  → -i descarga las deps
#      YA COMPILADAS del repo oficial de Termux (solo compila el paquete pedido).
#   3. Verifica que los binarios/ELF del .deb generado son AArch64.
# Los .deb quedan en /home/builder/.termux-build/<paquete>/*.deb
# (build-package.sh es idempotente: no recompila si el .deb ya existe).
# ============================================================================

name: build

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint build scripts
        run: |
          for f in packages/*/build.sh; do bash -n "$f"; done

  build:
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        pkg: [zchunk, libcomps, libsolv]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize termux-packages tree
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages.git $GITHUB_WORKSPACE/termux-packages
          cp -r packages/* $GITHUB_WORKSPACE/termux-packages/packages/

      - name: Build ${{ matrix.pkg }} (aarch64)
        run: |
          cd "$GITHUB_WORKSPACE/termux-packages"
          ./build-package.sh -a aarch64 -i ${{ matrix.pkg }}

      - name: Verify AArch64 architecture
        run: |
          set -e
          DEB=$(find / -name '*.deb' -path '*/.termux-build/*' 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then echo "❌ No .deb found"; exit 1; fi
          echo "DEB: $DEB"
          mkdir -p /tmp/extract && dpkg-deb -x "$DEB" /tmp/extract
          NON_ARCH=0
          while IFS= read -r f; do
            FT=$(file "$f")
            echo "$FT"
            case "$FT" in
              *ELF*)
                if ! echo "$FT" | grep -q 'aarch64\|ARM aarch64'; then
                  echo "❌ NOT aarch64: $f"; NON_ARCH=1
                fi ;;
            esac
          done < <(find /tmp/extract -type f \( -name '*.so*' -o -perm -111 \) 2>/dev/null)
          exit $NON_ARCH

      - name: Stage .deb artifact
        run: |
          set -e
          mkdir -p /tmp/artifacts
          DEB=$(find / -name '*.deb' -path '*/.termux-build/*' 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then
            echo "❌ No .deb found to stage — build did not produce an artifact"
            exit 1
          fi
          echo "Staging: $DEB"
          cp "$DEB" /tmp/artifacts/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-aarch64
          path: /tmp/artifacts/
          if-no-files-found: error
