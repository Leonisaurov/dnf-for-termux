# ============================================================================
# deploy — publica el repositorio RPM firmado (dnf-for-termux) en GitHub Pages
# ============================================================================
# DESHABILITADO: sustituido por repo-full.yml como único writer de gh-pages/rpm/.
# Los jobs están con if: false para que nunca corran, ni siquiera con dispatch
# manual (el trigger existe solo para que el YAML sea válido en GitHub).
# Borrar tras validar el primer run de repo-full.
# (Histórico: convertía los .pkg.tar.xz del último build exitoso de build.yml a
#  .rpm aarch64 (scripts/pkg2rpm.sh), los firmaba con la clave GPG
#  (secreto RPM_SIGNING_KEY), generaba repodata/ (createrepo_c), firmaba
#  repomd.xml y publicaba en gh-pages/rpm/. Se conserva para recuperación.)
# ============================================================================

name: deploy

# DESHABILITADO: sin triggers reales (ver cabecera). `workflow_dispatch` es un
# evento VÁLIDO para GitHub Actions (con `on: []` el YAML es rechazado y el push
# fallaría); el job lleva `if: false`, así que nunca ejecuta nada. El input `run`
# se declara solo para que actionlint tipifique `github.event.inputs.run`.
on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Run ID de build.yml a usar (vacío = último exitoso)'
        required: false
        type: string

jobs:
  deploy:
    # if: false — deshabilitado para siempre (red de seguridad anti-dispatch).
    if: false
    # Runner ARM64 nativo: el rpm es aarch64 y rpmbuild en x86_64 no tiene las
    # macros de platform de aarch64 ("No compatible architectures found").
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      # 1. Checkout del repo (necesario para scripts/pkg2rpm.sh)
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Resolver el run de build.yml a usar:
      #    - si el input 'run' viene dado, se usa ese;
      #    - si no, se toma el último run exitoso de build.yml.
      - name: Resolver run de build.yml
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.run }}" ]; then
            echo "id=${{ github.event.inputs.run }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(gh run list --workflow=build.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')" >> "$GITHUB_OUTPUT"
          fi

      # 3. Descargar los artifacts .pkg.tar.xz del run resuelto
      - name: Descargar artifacts del run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.run.outputs.id }}" -D /tmp/pkgs

      # 4. Instalar herramientas RPM:
      #    - rpm: incluye rpmbuild en Ubuntu (verificado: /usr/bin/rpmbuild
      #      viene en el paquete rpm de Ubuntu/Debian; rpm-common es su
      #      dependencia y se instala automáticamente).
      #    - createrepo-c: genera repodata/.
      - name: Instalar herramientas (rpm, createrepo-c)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c

      # 5. Importar la clave de firma GPG. Sin la clave no se puede firmar
      #    nada: se aborta con un error claro.
      - name: Importar clave de firma (RPM_SIGNING_KEY)
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          if [ -z "$RPM_SIGNING_KEY" ]; then
            echo "::error::RPM_SIGNING_KEY no está configurado — set the RPM_SIGNING_KEY secret"
            exit 1
          fi
          echo "$RPM_SIGNING_KEY" | gpg --batch --import

      # 6. Convertir .pkg -> .rpm, firmar, generar repodata y firmar el repo
      - name: Convertir, firmar y generar repodata
        run: |
          set -euo pipefail
          mkdir -p /tmp/rpm-repo
          # Cada artifact de build.yml es un directorio con su .pkg.tar.xz
          for d in /tmp/pkgs/*/; do
            pkg=$(find "$d" -name '*.pkg.tar.*' | head -1)
            [ -z "$pkg" ] && continue
            bash scripts/pkg2rpm.sh "$pkg" /tmp/rpm-repo
          done
          ls /tmp/rpm-repo/*.rpm | wc -l            # esperado 8
          # Firmar todos los RPM con la clave "dnf-for-termux" (UID de la clave).
          # %__gpg_sign_cmd se define en ~/.rpmmacros, NO en --define de CLI:
          # en un archivo de macros las %{__signature_filename}/%{__plaintext_filename}
          # se expanden de forma DIFERIDA (cuando rpmsign ya las definió), mientras
          # que en --define se expanden en el momento (vacías) o con escape %%
          # quedan literales ("gpg: can't open '%{__plaintext_filename}'").
          # gpg va con ruta ABSOLUTA resuelta en runtime (el entorno de
          # rpm --addsign no hereda el PATH del shell:
          # "error: Could not exec gpg: No such file or directory") y con
          # --batch --no-tty --no-armor: sin agente/pinentry, apto para CI sin
          # TTY y para clave sin passphrase.
          GPG_BIN="$(command -v gpg)"
          printf '%%_gpg_name dnf-for-termux\n%%__gpg_sign_cmd %s --batch --no-tty --no-verbose --no-armor --output %%{__signature_filename} --detach-sign --local-user %%{_gpg_name} %%{__plaintext_filename}\n' "$GPG_BIN" > "$HOME/.rpmmacros"
          echo "== macro %__gpg_sign_cmd evaluado =="
          rpm --eval '%{__gpg_sign_cmd}'
          echo "== firmando =="
          rpm --addsign /tmp/rpm-repo/*.rpm
          # Exportar la clave pública e importarla en el keyring de rpm (rpm -K
          # valida contra su propio keyring, no ~/.gnupg; sin esto sale
          # "digests SIGNATURES NOT OK").
          "$GPG_BIN" --export --armor > "$HOME/rpm-pubkey.asc"
          mkdir -p "$HOME/rpmdb"
          rpm --define "_dbpath $HOME/rpmdb" --import "$HOME/rpm-pubkey.asc"
          echo "== verificación rpm -K (completo) =="
          rpm -K --define "_dbpath $HOME/rpmdb" /tmp/rpm-repo/*.rpm
          rpm -K --define "_dbpath $HOME/rpmdb" /tmp/rpm-repo/*.rpm | grep -c 'signatures OK'   # esperado 8
          # Metadatos del repo y firma del repomd.xml
          createrepo_c /tmp/rpm-repo
          gpg --batch --detach-sign --armor /tmp/rpm-repo/repodata/repomd.xml
          # Clave pública para que dnf5 valide las firmas
          "$GPG_BIN" --export --armor > /tmp/rpm-repo/termux-rpm.gpg

      # 7. Publicar el repo RPM en la rama gh-pages bajo rpm/
      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/rpm-repo
          publish_branch: gh-pages
          destination_dir: rpm
